name = "mpprouter"
main = "src/index.ts"
compatibility_date = "2026-04-09"
compatibility_flags = ["nodejs_compat"]
account_id = "2d3f34ca0a1426b30a7d07cf79bdac90"

[triggers]
crons = ["*/2 * * * *"]

# Custom domains.
#
# apiserver.mpprouter.dev was attached through the dashboard and is NOT
# optional here: once `routes` exists in this file wrangler manages the set,
# and leaving the older domain out risks detaching the hostname that currently
# serves production payments. Both are listed so the config is the whole truth.
#
# coupon.rozo.ai (2026-08-07) fronts the partner platform. The rozo.ai zone
# lives in this same account, which is why a custom_domain entry can create it.
[[routes]]
pattern = "apiserver.mpprouter.dev"
custom_domain = true

[[routes]]
pattern = "coupon.rozo.ai"
custom_domain = true

# Workers Logs retention. Without this block Cloudflare keeps NO request logs,
# so a production payment incident can only be debugged by catching it live with
# `wrangler tail` — useless after the fact. Established 2026-08-01 after a real
# Lightning order (paymentSession_bd1ba4d7…) could not be traced through the
# router at all: create-invoice is a stateless proxy that persists nothing.
# head_sampling_rate = 1 keeps every request; this Worker's volume is low enough
# that sampling would only create blind spots.
[observability]
enabled = true
head_sampling_rate = 1

# Force @stellar/stellar-sdk and @stellar/stellar-base to their CJS
# entry points, NOT the minified browser bundles.
#
# Without these aliases, esbuild's `browser: true` resolution (default
# for Workers) picks `dist/stellar-sdk.min.js` and `dist/
# stellar-base.min.js` — both of which inline their OWN copy of the
# Transaction/TransactionBuilder classes. Meanwhile any direct
# `require('@stellar/stellar-base')` from a sub-file (e.g.
# `stellar-sdk/lib/rpc/transaction.js`) ends up resolving to the
# CJS `lib/index.js` of stellar-base. Result: TWO copies of the
# `Transaction` class in the bundle, `instanceof` fails across
# them, and `assembleTransaction → TransactionBuilder.cloneFrom`
# throws `TypeError: expected a 'Transaction', got: [object Object]`.
#
# Aliasing both packages to their CJS entry forces every import to
# share one module instance.
[alias]
"@stellar/stellar-sdk" = "./node_modules/@stellar/stellar-sdk/lib/index.js"
"@stellar/stellar-base" = "./node_modules/@stellar/stellar-base/lib/index.js"

[[kv_namespaces]]
binding = "MPP_STORE"
id = "b0fa51efc09e4e708c6bd5061b0663e0"

# P1-3: Durable Object for linearizable CAS (mppx replay + cumulative).
# The AtomicStoreDO class is exported from src/index.ts (re-exported from
# src/mpp/atomic-store-do.ts). wrangler requires the class export to be
# reachable from the Worker `main` entry point — it is, via the re-export.
#
# On first deploy, wrangler creates the DO class automatically via the
# migration below. No manual provisioning needed.
#
# IMPORTANT: See "REMAINING FOR HUMAN" in the P1-3 task for the channel
# cumulative migration concern before cutting over.
[[durable_objects.bindings]]
name = "ATOMIC_STORE"
class_name = "AtomicStoreDO"

# Migration: create the AtomicStoreDO class on first deploy.
# wrangler requires at least one [[migrations]] entry to provision a new DO.
# The `tag` must be unique and is recorded in the DO's migration history.
# Only add new tags here; never modify or remove existing entries once deployed.
[[migrations]]
tag = "v1"
new_classes = ["AtomicStoreDO"]

# Playground prepaid credit ledger. Holds every playground balance, deposit
# intent, consumed (tx_hash, op_index) pair and call record. All playground
# state lives in ONE instance (idFromName("playground")) because the global
# outstanding-credit cap and the deposit replay guard are both global
# invariants — sharding by account would break both. Class exported from
# src/index.ts (re-exported from src/playground/ledger-do.ts).
[[durable_objects.bindings]]
name = "PLAYGROUND_LEDGER"
class_name = "PlaygroundLedger"

[[migrations]]
tag = "v2"
new_classes = ["PlaygroundLedger"]

# MPPRouter-specific D1 for the coupon security audit log (design 20260722).
# Historical, redacted (keyed-HMAC only) record of every /coupon/redeem outcome.
# This is NOT the Rozo Intents Supabase. Provision before deploy:
#   wrangler d1 create mpprouter-coupon-security
#   (paste the returned database_id below)
#   wrangler d1 migrations apply mpprouter-coupon-security --remote
# The migrations directory holds migrations/0001_coupon_security_events.sql.
[[d1_databases]]
binding = "COUPON_SECURITY_DB"
database_name = "mpprouter-coupon-security"
database_id = "4bcb90b4-57c6-4a7d-848e-30e043cbc8ca"
migrations_dir = "migrations"

# Per-provider service-quality metrics (SCF #44 reviewer feedback 2026-08-31).
# One row per paid upstream call; published on the public service pages.
# Deliberately a SEPARATE database from the coupon security audit above: that
# one is redacted forensic data, this one is public. Provision before deploy:
#   wrangler d1 create mpprouter-route-metrics
#   (paste the returned database_id below)
#   wrangler d1 migrations apply mpprouter-route-metrics --remote
# Migrations live in migrations-metrics/ (a per-database directory; wrangler
# tracks applied migrations per database, so they must not share one).
# COMMENTED OUT UNTIL PROVISIONED. Cloudflare rejects a placeholder database
# id, so leaving one here would break every deploy of this Worker, including
# deploys that have nothing to do with metrics. The binding is optional in
# code (ROUTE_METRICS_DB?), so with this block absent the Worker runs and
# metric recording is simply a no-op.
#
# To enable:
#   wrangler d1 create mpprouter-route-metrics
#   (paste the returned database_id below, then uncomment this block)
#   wrangler d1 migrations apply mpprouter-route-metrics --remote
#
[[d1_databases]]
binding = "ROUTE_METRICS_DB"
database_name = "mpprouter-route-metrics"
database_id = "5169f99e-916b-4dd1-a246-072a585a5abf"
migrations_dir = "migrations-metrics"

# Public keys (not secrets, safe to commit)
[vars]
# Browser-only OpenRouter fee canary. Founder activated the 1% canary on
# 2026-09-02 (Sep 6 gate: >=30 orders, $600 GMV, conversion drop <=20%).
# Invalid/missing values resolve to 0 in code; set back to "0" to roll back.
CHECKOUT_WEB_FEE_BPS = "100"
STELLAR_NETWORK = "stellar:pubnet"
STELLAR_RPC_URL = "https://soroban-rpc.mainnet.stellar.gateway.fm"
# Comma-separated POOL, round-robined per request (src/mpp/tempo-rpc.ts).
# Public Tempo endpoints rate-limit per source IP, and on Workers the egress
# IP is shared across the colo — we don't control it and can't raise the
# quota. Spreading over several independent providers multiplies the
# effective quota without needing an API key from any of them. A failing
# endpoint is skipped for 15s and traffic routes around it.
# All four verified 2026-08-12 to serve eth_getTransactionCount /
# eth_estimateGas / eth_getBlockByNumber on chain 4217.
#
# This is now the FALLBACK tier. A keyed endpoint belongs in the
# TEMPO_RPC_URL_PRIMARY *secret*, which is tried first and is the only tier
# that actually raises our ceiling (metered per key, not per shared IP).
# Two reasons it is a separate secret rather than this var:
#   1. A keyed URL carries its API key in the path, and this file is
#      committed.
#   2. A [vars] entry OVERRIDES a secret of the same name on deploy, so
#      reusing this name would silently discard the key.
# Set with: wrangler secret put TEMPO_RPC_URL_PRIMARY
TEMPO_RPC_URL = "https://1rpc.io/tempo,https://tempo-rpc.publicnode.com,https://rpc.tempo.xyz,https://tempo.drpc.org"
# UNUSED as of 2026-04-10. No code path reads this. See src/index.ts and
# notes.md for context. Intended to skip Soroban simulation for sub-$0.05
# charges; never implemented.
OPTIMISTIC_THRESHOLD = "0.05"
RATE_LIMIT_MAX = "10"

# 2026-04-11 fixed XLM/USD rate, operator-updated. Sets the conversion
# ratio for XLM-denominated Stellar channels so the router stays solvent
# in its cross-asset broker role: agent pays N/XLM_USD_RATE XLM on the
# Stellar side, router pays N USDC on the Tempo side, broker net ≈ 0.
# Update this whenever XLM price moves materially (>5% in either
# direction) and `wrangler deploy` to roll forward. Only XLM channels
# are affected — USDC SAC channels (like agent2) ignore this value.
# See internaldocs/v2-todo.md#c and v2-session-session-done.md §5.1.
XLM_USD_RATE = "0.1533"

# ---------- x402 inbound over Stellar (Phase 1) ----------
# Non-secret defaults for the stellar.x402 branch of the proxy.
# The router runs an in-process x402 facilitator backed by
# @x402/stellar/exact/facilitator, receives agent USDC on Stellar
# mainnet at STELLAR_X402_PAY_TO, and pays the downstream merchant
# from the existing Tempo pool. See src/mpp/stellar-x402-server.ts
# and tasks/todo.md for design.
#
# Flip X402_ENABLED to "false" to disable the new branch entirely
# (classifyAuth falls through to passthrough for non-mppx credentials).
# No other changes required.
X402_ENABLED = "true"
# G... recipient address. Agent USDC lands here after settle.
# Public key only — must NOT be a secret. Operators can rotate
# this by flipping the value and restarting.
#
# Intentionally set to the SAME address as STELLAR_ROUTER_PUBLIC
# (the mppx pool). Both the MPP `WWW-Authenticate` dialect and the
# x402 `Payment-Required` dialect advertise this one address as
# payTo, so a single Stellar account receives USDC from both
# protocols. This keeps operator accounting simple — one pool,
# one reconciliation. If you ever split these (e.g. isolate x402
# funds into a separate account for independent risk control),
# update this comment AND the two call sites:
#   - src/mpp/stellar-server.ts:75  (getRouterStellarAddress)
#   - src/mpp/stellar-x402-server.ts:436  (buildX402PaymentRequiredHeader)
STELLAR_X402_PAY_TO = "GDK3AVW3YE6UL3J4WLNKBMP65KSY32YPUKIOC6PXW65XJ3LEG3YIDXXB"

# Coupon admin endpoints (issue/resolve/get) kill switch. Public
# redeem/status are always on. Deliberately separate from
# ADMIN_ENDPOINT_ENABLED (which gates /admin/pay-invoice and stays
# unset/off in production). Flip to "false" + redeploy to stop coupon
# issuance instantly without touching secrets. See src/routes/coupon.ts.
COUPON_ENDPOINT_ENABLED = "true"

# Partner platform kill switch. Covers the pages AND the API together: a
# half-open surface looks usable and then fails at the point where money moves.
# Flip to "false" and redeploy to pull the feature without a code rollback.
PARTNER_ENDPOINT_ENABLED = "true"
# NOTE: PARTNER_CONTACT was removed on 2026-08-07. Every "contact us" route on
# the partner pages is the Intercom launcher now, so a hostname-shaped contact
# string here would only ever go stale and send someone to a dead channel.

# Playground kill switch. Every /v1/playground/* route 404s (not 403s — a
# disabled playground should look like one that was never deployed) unless
# this is exactly "true". Ships OFF: the feature needs
# PLAYGROUND_SESSION_SECRET set and a founder-approved deploy before it can
# take a single real deposit. See docs/playground.md.
PLAYGROUND_ENABLED = "true"

# Global outstanding-credit ceiling in USD for the playground. Deposit
# intents are refused once (Σ balances + Σ open holds) + the new deposit
# would exceed it. This is the single number bounding total exposure of the
# feature: the router pays every upstream call out of its own pool, so the
# most the playground can cost us is roughly this, plus committed spend.
# An unparseable value falls back to the compiled-in $200 default rather
# than to "unlimited" — see globalCapAtomic() in src/playground/ledger-client.ts.
PLAYGROUND_GLOBAL_CAP_USD = "200"

